schema_version: 1
last_verified: "2026-08-24"

repositories:
  mlai-au:
    lifecycle: active
    url: https://github.com/MLAI-AUS-Inc/mlai-au
    purpose: Public website and browser applications
    runtime: cloudflare-workers
    languages: [typescript]
    package_manager: bun
    owns:
      - mlai.au browser experience
    depends_on: [mlai-backend]
    instructions: AGENTS.md

  mlai-backend:
    lifecycle: active
    url: https://github.com/MLAI-AUS-Inc/mlai-backend
    purpose: Shared Django APIs, identity, persistent data, integrations, jobs, and workers
    runtime: containers
    languages: [python]
    database: postgresql
    owns:
      - shared MLAI API
      - MLAI users and organisations
      - backend scheduled work
    migration_policy: explicit_approval_for_exact_migration
    instructions: AGENTS.md

  roo:
    lifecycle: active
    url: https://github.com/MLAI-AUS-Inc/roo
    purpose: Slack-facing public and administrative AI agent services
    runtime: containers
    languages: [python]
    application_root: roo-standalone
    depends_on: [mlai-backend]
    instructions: AGENTS.md

  mlai-chat:
    lifecycle: experimental_inactive
    url: https://github.com/MLAI-AUS-Inc/mlai-chat
    upstream: https://github.com/block/buzz
    purpose: Experiment deploying and adapting the open-source Buzz collaboration platform
    runtime: containers-and-native-clients
    languages: [rust, typescript, dart]
    depends_on: [mlai-backend]
    migration_policy: explicit_approval_for_exact_migration
    instructions: AGENTS.md

  mlai-plane:
    lifecycle: experimental_inactive
    url: https://github.com/MLAI-AUS-Inc/mlai-plane
    upstream: https://github.com/makeplane/plane
    purpose: Experiment deploying and adapting the open-source Plane application
    default_branch: preview
    runtime: containers
    languages: [python, typescript]
    depends_on: [mlai-plane-edge]
    migration_policy: explicit_approval_for_exact_migration
    instructions: AGENTS.md

  mlai-plane-edge:
    lifecycle: experimental_inactive
    url: https://github.com/MLAI-AUS-Inc/mlai-plane-edge
    purpose: Edge-routing prototype for the inactive Plane deployment experiment
    runtime: cloudflare-workers
    languages: [typescript]
    package_manager: bun
    depends_on: [mlai-plane]
    instructions: AGENTS.md
